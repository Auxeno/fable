[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable"
version = "0.1.1"
description = "A  compact storytelling language model implemented from scratch using JAX and Flax NNX."
readme = "readme.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Goddard" }]
dependencies = [
    "jax",
    "flax>=0.12",
    "optax",
    "orbax-checkpoint",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "black",
    "ipykernel",
    "pytest",
]

[project.scripts]
fable-generate = "fable.generate:main"
fable-train = "fable.train:main"
fable-prepare-data = "fable.data.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fable*"]
exclude = ["notebooks", "scripts", "checkpoints", "data", "experiments.ipynb"]

[tool.setuptools.package-data]
"fable.data" = ["tokenizer-config.json"]
"fable.checkpoints" = ["demo.ckpt/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
